version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      better-auth:
        patterns: ["better-auth", "@better-auth/*", "auth"]
      react:
        patterns: ["react", "react-dom", "react-server-dom-webpack"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
